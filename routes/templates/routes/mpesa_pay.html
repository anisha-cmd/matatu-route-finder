{% extends 'routes/base.html' %}

{% block title %}M-Pesa Payment | Matatu Route Finder{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="text-center mb-4">M-Pesa Payment</h2>

    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title mb-3">Route: {{ route.from_stage.name }} → {{ route.to_stage.name }}</h5>
            <p><strong>Stop:</strong> {{ stop.name }}</p>
            <p><strong>Fare:</strong> KSh {{ stop.fare }}</p>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="sacco_id" value="{{ saccos.first.id }}">
                
                <div class="mb-3">
                    <label for="phone_number" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone_number" name="phone_number" placeholder="Enter your phone number" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Pay with M-Pesa</button>
            </form>

            <a href="{% url 'route_details' route.id %}" class="btn btn-secondary mt-3 w-100">Back to Route</a>
        </div>
    </div>
</div>
{% endblock %}
